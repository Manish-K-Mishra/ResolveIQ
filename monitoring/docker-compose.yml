# Local monitoring stack: Prometheus + Grafana, pointed at the CloudServe API on the host.
#   docker compose -f monitoring/docker-compose.yml up -d     then open http://127.0.0.1:3000
# Ports are bound to 127.0.0.1 only. The Grafana admin password comes from GRAFANA_ADMIN_PASSWORD;
# the fallback "admin" is a LOCAL-ONLY default for a stack that is not reachable from the network.
services:
  prometheus:
    image: prom/prometheus:v3.5.0
    volumes:
      - ./prometheus.yml:/etc/prometheus/prometheus.yml:ro
    ports:
      - "127.0.0.1:9090:9090"
    extra_hosts:
      - "host.docker.internal:host-gateway"   # Linux; Docker Desktop provides it already
  grafana:
    image: grafana/grafana:12.1.1
    depends_on: [prometheus]
    environment:
      GF_SECURITY_ADMIN_USER: ${GRAFANA_ADMIN_USER:-admin}
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:-admin}
      GF_USERS_ALLOW_SIGN_UP: "false"
      GF_ANALYTICS_REPORTING_ENABLED: "false"
      GF_ANALYTICS_CHECK_FOR_UPDATES: "false"
    volumes:
      - ./grafana/provisioning:/etc/grafana/provisioning:ro
      - ./grafana/dashboards:/var/lib/grafana/dashboards:ro
    ports:
      - "127.0.0.1:3000:3000"
